  <circle cx="21.4" cy="21.4" r="5" fill="#FFE600" stroke="#0B1222" stroke-width="2"/>
  <circle cx="42.6" cy="42.6" r="5" fill="#95BF47" stroke="#0B1222" stroke-width="2"/>
  <circle cx="45.4" cy="24.3" r="3.2" fill="#22D3EE" stroke="#0B1222" stroke-width="1.6"/>
</svg>
